<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gondolin Stats</title>
<style>
body{background:#111;color:#ddd;font-family:sans-serif;margin:20px}
h1{color:#fff;margin:0 0 4px}
#info{color:#888;margin-bottom:12px}
.filters{display:flex;flex-wrap:wrap;gap:16px;align-items:center;margin-bottom:12px}
.filters label{color:#e0b050;font-size:14px}
.filters select{background:#1c1c1c;color:#ddd;border:1px solid #333;border-radius:4px;padding:6px 10px;margin-left:6px;font-size:14px}
.filters select:disabled{opacity:.4}
.wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{padding:6px 10px;border-bottom:1px solid #2a2a2a;text-align:right;white-space:nowrap}
th{cursor:pointer;color:#e0b050;position:sticky;top:0;background:#111}
td:first-child,th:first-child,td:nth-child(2),th:nth-child(2){text-align:left}
tr:hover td{background:#1c1c1c}
#empty{color:#888;padding:16px 0;display:none}
</style>
</head>
<body>
<h1>Full Invasion</h1>
<div id="info">Gondolin server - FI2 Osiris - Lifetime player stats</div>
<div class="filters">
  <label>Show stats<select id="mode"><option value="all">All</option><option value="as">As faction</option><option value="vs">Against faction</option></select></label>
  <label>Faction<select id="faction"></select></label>
</div>
<div class="wrap"><table><thead id="head"></thead><tbody id="body"></tbody></table></div>
<div id="empty">No players with stats for this filter yet.</div>
<script>
const COLUMNS = [['#', null], ['name', 'Player'], ['kills', 'Kills'], ['deaths', 'Deaths'], ['score', 'Score'], ['points', 'Top points'], ['waves', 'Waves cleared'], ['wins', 'Games won'], ['bosses', 'Bosses'], ['finals', 'End bosses'], ['chests', 'Leg chests'], ['recruits', 'Recruit/Soldier kills'], ['w1h', '1H'], ['w2h', '2H'], ['pole', 'Polearm'], ['bow', 'Bows'], ['xbow', 'Crossbows'], ['throw', 'Throwing'], ['firearm', 'Firearms'], ['magic', 'Magic'], ['other', 'Other']];
const STAT_KEYS = COLUMNS.slice(2).map(([key]) => key);
const DEFENDER_FACTIONS = {22: 'Greeks', 23: 'Empire', 24: 'Calradia', 25: 'Crusaders', 26: 'Sigmar', 27: 'LOTR', 28: 'Saracens'};
const INVADER_FACTIONS = {29: 'Greeks', 30: 'Blackmarch', 31: 'Calradia', 32: 'Chaos', 33: 'Crusaders', 34: 'Free Peoples', 35: 'Full Invasion', 36: 'Isengard', 37: 'Mordor', 38: 'Saracens', 99: 'Custom Invasions'};
const FACTION_GROUPS = {'LOTR (all)': [27, 34, 36, 37]};
let players = [];
let rows = [];
let sortKey = 'kills';
let sortDirection = -1;
const modeSelect = document.getElementById('mode');
const factionSelect = document.getElementById('faction');
function factionsForMode(mode) {
  return mode === 'as' ? DEFENDER_FACTIONS : INVADER_FACTIONS;
}
function fillFactionOptions() {
  const mode = modeSelect.value;
  factionSelect.disabled = mode === 'all';
  if (mode === 'all') {
    factionSelect.innerHTML = '<option value="all">All factions</option>';
    return;
  }
  const factions = factionsForMode(mode);
  let html = '<option value="all">All factions</option>';
  for (const [groupName, ids] of Object.entries(FACTION_GROUPS)) {
    if (ids.some(id => factions[id])) html += '<option value="g:' + groupName + '">' + groupName + '</option>';
  }
  for (const [id, name] of Object.entries(factions)) html += '<option value="f:' + id + '">' + name + '</option>';
  factionSelect.innerHTML = html;
}
function selectedFactionIds() {
  const mode = modeSelect.value;
  const factions = factionsForMode(mode);
  const value = factionSelect.value;
  if (value.startsWith('g:')) return FACTION_GROUPS[value.slice(2)].filter(id => factions[id]);
  if (value.startsWith('f:')) return [Number(value.slice(2))];
  return Object.keys(factions).map(Number);
}
function buildRows() {
  const mode = modeSelect.value;
  if (mode === 'all') {
    rows = players.map(player => {
      const row = {name: player.name};
      STAT_KEYS.forEach(key => row[key] = player[key] || 0);
      return row;
    });
    return;
  }
  const factionIds = selectedFactionIds();
  rows = [];
  for (const player of players) {
    const factionData = (player.fac && player.fac[mode]) || {};
    const row = {name: player.name};
    for (const key of STAT_KEYS) {
      row[key] = factionIds.reduce((total, id) => total + ((factionData[id] && factionData[id][key]) || 0), 0);
    }
    if (STAT_KEYS.some(key => row[key] > 0)) rows.push(row);
  }
}
function render() {
  buildRows();
  rows.sort((a, b) => sortKey === 'name' ? sortDirection * a.name.localeCompare(b.name) : sortDirection * (a[sortKey] - b[sortKey]));
  document.getElementById('head').innerHTML = '<tr>' + COLUMNS.map(([key, label]) => '<th data-key="' + key + '">' + (label || '#') + '</th>').join('') + '</tr>';
  document.getElementById('body').innerHTML = rows.map((row, index) => '<tr><td>' + (index + 1) + '</td>' + COLUMNS.slice(1).map(([key]) => '<td>' + (key === 'name' ? row.name.replace(/[<>&]/g, '') : row[key].toLocaleString('en').replace(/,/g, ' ')) + '</td>').join('') + '</tr>').join('');
  document.getElementById('empty').style.display = rows.length ? 'none' : 'block';
  document.querySelectorAll('th').forEach(th => th.onclick = () => {
    const key = th.dataset.key;
    if (key === '#') return;
    sortDirection = sortKey === key ? -sortDirection : -1;
    sortKey = key;
    render();
  });
}
modeSelect.onchange = () => {
  fillFactionOptions();
  render();
};
factionSelect.onchange = render;
fillFactionOptions();
fetch('stats.json?' + Date.now()).then(response => response.json()).then(data => {
  players = data.players;
  document.getElementById('info').textContent += ' - updated ' + new Date(data.updated).toLocaleString();
  render();
});
</script>
</body>
</html>
