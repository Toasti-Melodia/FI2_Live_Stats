name: stats
on: workflow_dispatch
permissions:
  contents: write
concurrency:
  group: stats
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save ssh2-sftp-client
      - run: node build-stats.js
        env:
          S1_HOST: ${{ secrets.S1_HOST }}
          S1_PORT: ${{ secrets.S1_PORT }}
          S1_USER: ${{ secrets.S1_USER }}
          S1_PASS: ${{ secrets.S1_PASS }}
          S1_PATH: ${{ secrets.S1_PATH }}
          S2_HOST: ${{ secrets.S2_HOST }}
          S2_PORT: ${{ secrets.S2_PORT }}
          S2_USER: ${{ secrets.S2_USER }}
          S2_PASS: ${{ secrets.S2_PASS }}
          S2_PATH: ${{ secrets.S2_PATH }}
      - run: |
          git config user.name "stats-bot"
          git config user.email "stats-bot@users.noreply.github.com"
          git add docs/stats.json docs/week.json docs/month.json docs/quarter.json docs/half.json docs/year.json
          git diff --cached --quiet || (git commit -m "update stats" && git push)
